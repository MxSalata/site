# Build the site and run scripts/check-dist.sh on every push to main and every pull request. The leak check needs the
# patterns, which never leave House, so it stays in House's pre-push hook; the PDF and image metadata checks need
# House's Python tools and are skipped here.
name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sh scripts/check-dist.sh
